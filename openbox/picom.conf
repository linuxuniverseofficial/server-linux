# ~/.config/picom.conf
# Compositor para Openbox: sombras, fading, sem tearing
# Instale: sudo apt install picom

#---------------------------------------------
# BACKEND
#---------------------------------------------
backend = "glx";           # ou "xrender" em hardware mais antigo
vsync = true;
glx-no-stencil = true;
glx-copy-from-front = false;

#---------------------------------------------
# SOMBRAS
#---------------------------------------------
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.6;
shadow-color = "#000000";

# Janelas sem sombra
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'tint2'",
    "class_g = 'conky'",
    "class_g = 'Kupfer'",
    "_GTK_FRAME_EXTENTS@:c",
    "name *= 'compton'",
    "name *= 'picom'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

#---------------------------------------------
# FADING (transições suaves)
#---------------------------------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

fade-exclude = [];

#---------------------------------------------
# OPACIDADE
#---------------------------------------------
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Não aplicar opacidade nestes
opacity-rule = [
    "100:class_g = 'tint2'",
    "100:class_g = 'Firefox'",
    "100:class_g = 'chromium'",
    "100:name = 'Notification'",
    "100:class_g = 'vlc'",
    "90:class_g = 'XTerm'",
    "95:class_g = 'xfce4-terminal'"
];

#---------------------------------------------
# BLUR (comentado por padrão - pesado em iGPU)
#---------------------------------------------
# blur-method = "dual_kawase";
# blur-strength = 5;
# blur-background = true;
# blur-background-exclude = [
#     "class_g = 'tint2'"
# ];

#---------------------------------------------
# OUTRAS OPÇÕES
#---------------------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "error";

wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};
